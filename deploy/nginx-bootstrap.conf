# The :80 half of deploy/nginx.conf on its own, for the minutes before a certificate
# exists (deploy/README.md §7).
#
# nginx refuses to load a server block whose ssl_certificate file is missing, and
# certbot cannot issue that file until nginx answers for the domain on :80. So the order
# is: this file, then certbot, then the full nginx.conf over the top of it.
#
#   cp deploy/nginx-bootstrap.conf /etc/nginx/sites-available/mahjong   # edit the domain
#   ln -s /etc/nginx/sites-available/mahjong /etc/nginx/sites-enabled/
#   mkdir -p /var/www/html && nginx -t && systemctl reload nginx
#   certbot certonly --webroot -w /var/www/html -d example.com
#   cp deploy/nginx.conf /etc/nginx/sites-available/mahjong             # edit the domain, and connect-src
#   nginx -t && systemctl reload nginx
#
# Nothing is proxied here, on purpose. Serving the app over http even briefly is how the
# first deployment lost its sign-in cookies (§4, "TLS is not optional here").

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 503; }
}
