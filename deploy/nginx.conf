# nginx in front of the app (PROTOCOL.md §10).
#
# Use this INSTEAD of deploy/Caddyfile whenever the host already runs nginx — which it
# will if Pantheon shares the box, since every Pantheon container ships its own. The two
# are not merely redundant: only one process can hold :80 and :443, so whichever starts
# second fails to bind.
#
# Replace example.com, and replace the Frey origin inside connect-src. Then:
#
#   cp deploy/nginx.conf /etc/nginx/sites-available/mahjong
#   ln -s /etc/nginx/sites-available/mahjong /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# The app itself only ever listens on 127.0.0.1:8080 (server/server.js), and Pantheon is
# reached over localhost from the backend. Nothing but nginx faces the network.

server {
    listen 80;
    listen [::]:80;
    server_name example.com;

    # certbot's HTTP-01 challenge has to stay on :80; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    access_log /var/log/nginx/mahjong.access.log;
    error_log  /var/log/nginx/mahjong.error.log;

    # The submission stage runs the vendored tlock bundle and talks to drand. No CDN is
    # allowed: the code that handles a player's plaintext number is part of the freeze,
    # so it must come from this origin and nowhere else.
    #
    # connect-src ALSO needs the Frey base URL. PANTHEON-INTEGRATION.md §2 has the
    # BROWSER authenticate against Pantheon directly, so a missing Frey origin blocks
    # sign-in with nothing in this server's log to explain it — the request never
    # reaches any server. Add it explicitly, scheme and port included:
    #
    #   connect-src 'self' https://pantheon.example.com https://api.drand.sh ...
    #
    # The drand hosts must be a superset of runtime.json's drand.api and drand.mirrors.
    # Switching mirrors mid-window (PROTOCOL.md §4.2) means editing both: a mirror
    # missing from this list is blocked in the browser and the submission stage fails.
    #
    # This is the SECOND policy on an /admin response: the app sends its own, and a
    # browser enforces both at once, so what applies is the intersection. Removing a
    # source here therefore removes it from the dashboard too, however the app is
    # configured — which is how the dashboard once arrived with every style rule
    # stripped. Keep 'self' on script-src and style-src.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://api.drand.sh https://api2.drand.sh https://api3.drand.sh https://drand.cloudflare.com; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $proxy_add_x_forwarded_for is "$http_x_forwarded_for, $remote_addr": whatever
        # the client sent, then the address nginx actually saw. So the RIGHTMOST entry
        # is the trustworthy one and a forged prefix ends up to the left of it, which is
        # the entry server/server.js reads. Verified against nginx 1.28: a client
        # sending "1.2.3.4" arrives here as "1.2.3.4, <its real address>".
        #
        # The app ignores this header unless data/runtime.json sets server.trust_proxy
        # to true. Set it once this proxy is in front, or the per-source rate limit
        # becomes one allowance shared by every player, since every request arrives
        # from 127.0.0.1.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Not a websocket, but the SSE stream is a long-lived HTTP/1.1 response and an
        # inherited "Connection: close" would end it after the first frame.
        proxy_set_header Connection        "";

        # Server-Sent Events must not be buffered or the waiting stage stops updating
        # and silently degrades to polling. The app sends `X-Accel-Buffering: no` on
        # that response (server/events.js) and nginx honours it on its own, so this is
        # belt and braces — but it costs nothing here. Twelve players do not need
        # response buffering, and having it off means one less thing to be wrong.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}

